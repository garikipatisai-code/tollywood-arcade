<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Egara — Tollywood Arcade</title>
    <link rel="stylesheet" href="../../src/styles/game.css" />
    <style>
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(5, 3, 10, 0.5) 100%);
        z-index: 1;
      }
      .ta-bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 34px;
        background: #000;
        z-index: 1;
        pointer-events: none;
      }
      .ta-bar--top { top: 0; }
      .ta-bar--bottom { bottom: 0; }
    </style>
  </head>
  <body>
    <div id="game-container"><div id="vignette" aria-hidden="true"></div><div class="ta-bar ta-bar--top" aria-hidden="true"></div><div class="ta-bar ta-bar--bottom" aria-hidden="true"></div></div>
    <script type="module" src="../../src/games/egara/main.ts"></script>
  </body>
</html>
